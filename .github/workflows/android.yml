name: Crear APK de Android

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Localizar la carpeta del proyecto
        run: |
          APP=$(find . -type d -name app-android -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No encuentro la carpeta app-android en el repositorio. Sube TODO el contenido de salamence-music (incluida la carpeta app-android)."
            ls -la
            exit 1
          fi
          echo "APP_DIR=$APP" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $APP"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Preparar el proyecto Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npx cap telemetry off || true
          node prep.js
          npx cap add android
          node setup-native.js
          npx @capacitor/assets generate --android --assetPath resources || echo "Sin iconos personalizados (se usa el de Capacitor)"
          npx cap sync android

      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        run: |
          if [ -f "$APP_DIR/debug.keystore" ]; then
            mkdir -p ~/.android
            cp "$APP_DIR/debug.keystore" ~/.android/debug.keystore
            echo "Firma fija aplicada"
          else
            echo "No hay debug.keystore: se usará una firma nueva"
          fi

      - name: Compilar el APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" salamence-music.apk

      - name: Guardar el APK como resultado de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: salamence-music-apk
          path: salamence-music.apk

      - name: Publicar el APK en Releases (para descargarlo desde el móvil)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Salamence music (APK ${{ github.run_number }})
          body: Descarga salamence-music.apk, ábrelo en el móvil e instálalo.
          files: salamence-music.apk
